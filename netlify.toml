[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"


# Redirect /api/login to the Netlify Function
[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

# Redirect /api/change_credentials to the Netlify Function
[[redirects]]
  from = "/api/change_credentials"
  to = "/.netlify/functions/change_credentials"
  status = 200

# SPA fallback — always serve index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

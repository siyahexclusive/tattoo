[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API redirects with force=true to prevent the /* SPA fallback from intercepting them.
[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200
  force = true

[[redirects]]
  from = "/api/change_credentials"
  to = "/.netlify/functions/change_credentials"
  status = 200
  force = true

# SPA fallback — must come LAST.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

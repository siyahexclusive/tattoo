[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — serve index.html for all non-API, non-function routes.
# The /api/* routes are handled directly by Netlify Functions (via config.path in each function).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

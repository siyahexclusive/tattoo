# render.yaml — Render Blueprint for one-click deployment
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Flask Backend ────────────────────────────────────────────────────────
  - type: web
    name: siyah-tattoo-backend
    env: python
    region: frankfurt           # Closest to Berlin — lowest latency
    # We remove rootDir so the build script runs from the project root
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn app:app -c gunicorn.conf.py
    healthCheckPath: /api/health
    envVars:
      # Tell Render to install Node.js alongside Python
      - key: NODE_VERSION
        value: 20

      # Pin Python version for psycopg2 compatibility
      - key: PYTHON_VERSION
        value: 3.11.9

      # PostgreSQL connection string — From Supabase
      - key: DATABASE_URL
        sync: false

      # Supabase URL and Key for storage
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

      # Admin credentials — fill these in the Render dashboard after deploy
      - key: ADMIN_USERNAME
        sync: false             # Mark sync: false → you enter the value manually

      - key: ADMIN_PASSWORD
        sync: false

      # Auto-generated secure random key for Flask sessions
      - key: SECRET_KEY
        generateValue: true

      # Set to your Netlify URL, e.g.: https://siyah-tattoos.netlify.app
      # Multiple origins: https://a.netlify.app,https://custom-domain.com
      - key: CORS_ORIGINS
        sync: false
